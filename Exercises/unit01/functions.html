<html>
    <script>
        // Slide 8
        // function with defeault parameter
        const calculateTax = (subtotal, taxRate = 0.074) => {
            const tax = subtotal * taxRate;
            return tax.toFixed(2);
        }
        const tax1 = calculateTax(100);
        document.write("Tax 1: " + tax1 + "<br>");

        const tax2 = calculateTax(100, 0.087);
        document.write("Tax 2: " + tax2 + "<br>");

        const tax3 = calculateTax(100, null);
        document.write("Tax 3: " + tax3 + "<br>");

        const tax4 = calculateTax(100, undefined);
        document.write("Tax 4: " + tax4 + "<br>");


    //Slide 9
    // an arrow function with 1 parameter and a default value
    const getArea = (radius = 15) => {
        return Math.round(Math.PI * radius ** 2);
    }
    const area1 = getArea();
    document.write("Area 1: " + area1 + "<br>")
    const area2 = getArea(4);
    document.write("Area 2: " + area2 + "<br>")

    //Slide 11
    // an arrow function with a rest parameter
    const calculateTaxAll = (taxRate, ...subtotals) => {
        let tax = 0;
        for(let subtotal of subtotals) {
            tax += subtotal * taxRate;
        }
        return tax.toFixed(2);
    }
    const tax5 = calculateTaxAll(0.074, 100, 200, 300)
    </script>

</html>
